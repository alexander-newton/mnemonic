version: '3.9'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - mnemonic_dev

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    depends_on:
      redis:
        condition: service_healthy
    command: uv run uvicorn mnemonic.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    networks:
      - mnemonic_dev

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: dev
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/index.html:/app/index.html
      - ../frontend/vite.config.ts:/app/vite.config.ts
      - ../frontend/tsconfig.json:/app/tsconfig.json
    depends_on:
      - backend
    command: npm run dev
    restart: unless-stopped
    networks:
      - mnemonic_dev

volumes:
  redis_dev_data:

networks:
  mnemonic_dev:
    driver: bridge
